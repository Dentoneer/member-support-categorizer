# Databricks App definition. Deploy with the app's source code path = the root of this Git folder.
command: ["streamlit", "run", "app/app.py"]
env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse   # add the SQL warehouse as an app resource with this key
  - name: CATALOG
    value: workspace
  - name: SCHEMA
    value: support
  - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
    value: "false"
